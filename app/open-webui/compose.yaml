# Open WebUI（spark1 の vLLM に接続するチャット UI）
# このディレクトリで実行する: docker compose up -d
# 設定は .env（.env.example をコピーして作る）、データは ./data に保存する。
name: open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: open-webui
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      # 既定では chat ホストの中からだけ接続できる。社内 LAN に公開する場合は .env で OPEN_WEBUI_BIND=0.0.0.0 にする。
      - "${OPEN_WEBUI_BIND:-127.0.0.1}:${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      # アカウント、会話履歴（webui.db）、アップロード、キャッシュ
      - ./data:/app/backend/data
